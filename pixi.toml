[workspace]
name = "m3d-net"
version = "0.1.0"
description = "Multimodal breast cancer classification: model, training, and reproduction code"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.11.*"
pip = "*"

[pypi-dependencies]
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.22.1", index = "https://download.pytorch.org/whl/cu128" }
timm = "==1.0.15"
mmcv-lite = "==2.2.0"
mmengine = "==0.10.7"
numpy = "==1.26.4"
pandas = "==2.3.3"
scikit-learn = "==1.9.0"
pillow = "==12.3.0"
openpyxl = "==3.1.5"
opencv-python = "==4.11.0.86"
requests = "==2.34.2"

[activation.env]
PYTHONUTF8 = "1"
PYTHONIOENCODING = "utf-8"

[tasks]
smoke = "python tests/smoke.py --device cpu"
smoke-cuda = "python tests/smoke.py --device cuda"
test = "python -m unittest discover -s tests -p test_*.py"
weights = "python download.py weights"
download-breast = "python download.py breast"
prepare-breast = "python prepare_data.py --archive data/downloads/breast_lesions_usg.zip"
reproduce = "python -u reproduce.py"
