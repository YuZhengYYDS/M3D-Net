<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">M3D-Net architecture and ultrasound adaptation</title><desc id="desc">The base four-stage mammography encoder places MCA, MUDD, and DA according to spatial resolution. A separately adapted BrEaST system fuses 1000 image features and 1000 clinical features for binary classification. Counts of MUDD updates refer to nonempty within-stage history.</desc>
<defs><linearGradient id="navy" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102039"/><stop offset="1" stop-color="#21375a"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b9bb0"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="710" rx="18" fill="#f7f9fc" stroke="#e1e7ef"/><text x="30" y="45" font-size="26" fill="#182b46" font-weight="700" text-anchor="start">Resolution-aware hierarchy</text><text x="30" y="76" font-size="16" fill="#64758d" font-weight="400" text-anchor="start">Base mammography encoder</text><text x="1170" y="48" font-size="16" fill="#64758d" font-weight="400" text-anchor="end">256 x 256 RGB input  /  stride-4 stem</text><rect x="30" y="108" width="252" height="186" rx="12" fill="#edf4fc" stroke="#3a73aa"/><text x="48" y="139" font-size="15" fill="#3a73aa" font-weight="700" text-anchor="start">STAGE 1</text><text x="48" y="174" font-size="21" fill="#182b46" font-weight="600" text-anchor="start">64 x 64 / 48 channels</text><text x="48" y="205" font-size="16" fill="#485b74" font-weight="400" text-anchor="start">3 blocks  /  SRA global branch</text><path d="M48 222H264" stroke="#3a73aa" stroke-opacity=".22"/><text x="48" y="248" font-size="16" fill="#3a73aa" font-weight="400" text-anchor="start">MCA blocks: 1</text><text x="48" y="273" font-size="16" fill="#3a73aa" font-weight="400" text-anchor="start">MUDD history updates: 0</text><path d="M288 190L317 190" fill="none" stroke="#8b9bb0" stroke-width="2" marker-end="url(#arrow)"/><rect x="326" y="108" width="252" height="186" rx="12" fill="#f3effa" stroke="#8266c7"/><text x="344" y="139" font-size="15" fill="#8266c7" font-weight="700" text-anchor="start">STAGE 2</text><text x="344" y="174" font-size="21" fill="#182b46" font-weight="600" text-anchor="start">32 x 32 / 96 channels</text><text x="344" y="205" font-size="16" fill="#485b74" font-weight="400" text-anchor="start">3 blocks  /  SRA global branch</text><path d="M344 222H560" stroke="#8266c7" stroke-opacity=".22"/><text x="344" y="248" font-size="16" fill="#8266c7" font-weight="400" text-anchor="start">MCA blocks: 1</text><text x="344" y="273" font-size="16" fill="#8266c7" font-weight="400" text-anchor="start">MUDD history updates: 2</text><path d="M584 190L613 190" fill="none" stroke="#8b9bb0" stroke-width="2" marker-end="url(#arrow)"/><rect x="622" y="108" width="252" height="186" rx="12" fill="#fcf3e9" stroke="#c48235"/><text x="640" y="139" font-size="15" fill="#c48235" font-weight="700" text-anchor="start">STAGE 3</text><text x="640" y="174" font-size="21" fill="#182b46" font-weight="600" text-anchor="start">16 x 16 / 224 channels</text><text x="640" y="205" font-size="16" fill="#485b74" font-weight="400" text-anchor="start">9 blocks  /  DA global branch</text><path d="M640 222H856" stroke="#c48235" stroke-opacity=".22"/><text x="640" y="248" font-size="16" fill="#c48235" font-weight="400" text-anchor="start">MCA blocks: 4</text><text x="640" y="273" font-size="16" fill="#c48235" font-weight="400" text-anchor="start">MUDD history updates: 8</text><path d="M880 190L909 190" fill="none" stroke="#8b9bb0" stroke-width="2" marker-end="url(#arrow)"/><rect x="918" y="108" width="252" height="186" rx="12" fill="#edf7f0" stroke="#488564"/><text x="936" y="139" font-size="15" fill="#488564" font-weight="700" text-anchor="start">STAGE 4</text><text x="936" y="174" font-size="21" fill="#182b46" font-weight="600" text-anchor="start">8 x 8 / 448 channels</text><text x="936" y="205" font-size="16" fill="#485b74" font-weight="400" text-anchor="start">3 blocks  /  DA global branch</text><path d="M936 222H1152" stroke="#488564" stroke-opacity=".22"/><text x="936" y="248" font-size="16" fill="#488564" font-weight="400" text-anchor="start">MCA blocks: 0</text><text x="936" y="273" font-size="16" fill="#488564" font-weight="400" text-anchor="start">MUDD history updates: 2</text><text x="32" y="324" font-size="16" fill="#64758d" font-weight="400" text-anchor="start">Spatial resolution decreases; history resets at stage boundaries.</text><text x="1168" y="324" font-size="16" fill="#182b46" font-weight="600" text-anchor="end">GAP: 448-D  &gt;  3-class head</text><rect x="30" y="352" width="348" height="170" rx="12" fill="#ffffff" stroke="#e1e7ef"/><text x="50" y="381" font-size="13" fill="#3a73aa" font-weight="700" text-anchor="start">01  CONTEXT</text><text x="50" y="413" font-size="25" fill="#3a73aa" font-weight="700" text-anchor="start">MCA</text><text x="50" y="442" font-size="16" fill="#485b74" font-weight="400" text-anchor="start">Pooled grids: 1 x 1, 2 x 2, 4 x 4</text><text x="50" y="467" font-size="16" fill="#485b74" font-weight="400" text-anchor="start">Explicit 2-D coordinate information</text><text x="50" y="492" font-size="16" fill="#485b74" font-weight="400" text-anchor="start">Weights the local-global mixture</text><rect x="426" y="352" width="348" height="170" rx="12" fill="#ffffff" stroke="#e1e7ef"/><text x="446" y="381" font-size="13" fill="#8266c7" font-weight="700" text-anchor="start">02  REUSE</text><text x="446" y="413" font-size="25" fill="#8266c7" font-weight="700" text-anchor="start">MUDD</text><text x="446" y="442" font-size="16" fill="#485b74" font-weight="400" text-anchor="start">Four channel paths</text><text x="446" y="467" font-size="16" fill="#485b74" font-weight="400" text-anchor="start">At most four recent feature maps</text><text x="446" y="492" font-size="16" fill="#485b74" font-weight="400" text-anchor="start">Retrieval before local-global mixing</text><rect x="822" y="352" width="348" height="170" rx="12" fill="#ffffff" stroke="#e1e7ef"/><text x="842" y="381" font-size="13" fill="#488564" font-weight="700" text-anchor="start">03  CONTRAST</text><text x="842" y="413" font-size="25" fill="#488564" font-weight="700" text-anchor="start">DA</text><text x="842" y="442" font-size="16" fill="#485b74" font-weight="400" text-anchor="start">Difference of two attention maps</text><text x="842" y="467" font-size="16" fill="#485b74" font-weight="400" text-anchor="start">Global branch in Stages 3 and 4</text><text x="842" y="492" font-size="16" fill="#485b74" font-weight="400" text-anchor="start">Coarse grids: 16 x 16 and 8 x 8</text><rect x="30" y="550" width="1140" height="133" rx="12" fill="#edf1f9" stroke="#d8e1ef"/><text x="50" y="580" font-size="20" fill="#3e5278" font-weight="700" text-anchor="start">BrEaST adaptation</text><text x="1150" y="579" font-size="14" fill="#64758d" font-weight="400" text-anchor="end">DA layout correction + STE projection shortcut</text><rect x="50" y="598" width="265" height="64" rx="8" fill="#ffffff" stroke="#d7e1ef"/><text x="182.5" y="624" font-size="16" fill="#182b46" font-weight="600" text-anchor="middle">Ultrasound image branch</text><text x="182.5" y="647" font-size="15" fill="#64758d" font-weight="400" text-anchor="middle">1000-D representation</text><rect x="351" y="598" width="265" height="64" rx="8" fill="#ffffff" stroke="#d7e1ef"/><text x="483.5" y="624" font-size="16" fill="#182b46" font-weight="600" text-anchor="middle">22 clinical features</text><text x="483.5" y="647" font-size="15" fill="#64758d" font-weight="400" text-anchor="middle">Transformer &gt; 1000-D</text><rect x="665" y="598" width="226" height="64" rx="8" fill="#ffffff" stroke="#d7e1ef"/><text x="778.0" y="624" font-size="16" fill="#182b46" font-weight="600" text-anchor="middle">Concatenate</text><text x="778.0" y="647" font-size="15" fill="#64758d" font-weight="400" text-anchor="middle">2000-D joint features</text><rect x="939" y="598" width="211" height="64" rx="8" fill="#ffffff" stroke="#d7e1ef"/><text x="1044.5" y="624" font-size="16" fill="#182b46" font-weight="600" text-anchor="middle">Shared MLP</text><text x="1044.5" y="647" font-size="15" fill="#64758d" font-weight="400" text-anchor="middle">1024 &gt; 512 &gt; 2</text><text x="333" y="637" font-size="25" fill="#8266c7" font-weight="600" text-anchor="middle">+</text><path d="M624 631L651 631" fill="none" stroke="#8b9bb0" stroke-width="2" marker-end="url(#arrow)"/><path d="M899 631L925 631" fill="none" stroke="#8b9bb0" stroke-width="2" marker-end="url(#arrow)"/></g></svg>